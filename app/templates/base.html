<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>{{ title or "Sistema de Agendamento" }}</title>

        <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">

        <!-- Bootstrap 5 -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

        <!-- FullCalendar -->
        <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/main.min.css" rel="stylesheet">

        <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    </head>

    <body>

    <header class="p-3 mb-3 border-bottom bg-primary">
        <div class="container d-flex justify-content-between align-items-center">

            <span class="text-white fw-bold">Gestor de Clientes</span>

            <nav class="d-flex gap-2">

                <a class="btn btn-light btn-sm"
                href="{{ url_for('main.home') }}">
                    Home
                </a>

                <a class="btn btn-light btn-sm"
                href="{{ url_for('client.clients') }}">
                    Clientes
                </a>

                <a class="btn btn-light btn-sm"
                href="{{ url_for('appointment.appointments') }}">
                    Agendamentos
                </a>

                <!--<a class="btn btn-light btn-sm"
                href="{{ url_for('appointment.calendar') }}">
                    Calendário
                </a>-->

                <a class="btn btn-light btn-sm"
                href="{{ url_for('admin.employees') }}">
                    Funcionários
                </a>

            </nav>

        </div>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <!-- FullCalendar -->
    <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/core@6.1.8/main.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/daygrid@6.1.8/main.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/interaction@6.1.8/main.min.js"></script>

    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script src="{{ url_for('static', filename='scripts.js') }}"></script>

    </body>
</html>
