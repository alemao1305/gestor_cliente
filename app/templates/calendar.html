
{% extends 'base.html' %}
{% block content %}

    <head>
        
        
        <title>Calendário</title>
        <link href='https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css' rel='stylesheet' />
        <script src='https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js'></script>
        <script src='https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/locales/pt-br.js'></script>
    </head>
    <body>

        <div id='calendar'></div>

        <script>
            document.addEventListener('DOMContentLoaded', function() {
                var calendarEl = document.getElementById('calendar');

                var calendar = new FullCalendar.Calendar(calendarEl, {
                    locale: 'pt-br',
                    initialView: 'dayGridMonth',
                    events: function(info, successCallback, failureCallback) {
                        fetch('/get-events?start=' + info.startStr + '&end=' + info.endStr)
                            .then(response => response.json())
                            .then(data => {
                                console.log('Eventos recebidos:', data);  // Depuração
                                successCallback(data);
                            })
                            .catch(error => {
                                console.error('Erro ao buscar eventos:', error);  // Depuração
                                failureCallback(error);
                            });
                    },
                    eventColor: '#378006',
                    dateClick: function(info) {
                        // Redireciona para a tela de agendamentos para o dia selecionado
                        window.location.href = '/tasks/' + info.dateStr; // Atualize esta URL conforme necessário
                    }
                });

                calendar.render();
            });
        </script>

    </body>
</html>
{% endblock %}
